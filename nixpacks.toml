# Railway - Nixpacks config for Backend (apps/api)
# Railway auto-detects Node.js + runs this. No Docker needed.

[phases.build]
cmds = [
  "npx prisma generate --schema packages/database/prisma/schema.prisma",
  "npm --workspace apps/api run build",
  "npx tsc-alias -p apps/api/tsconfig.json"
]

[start]
cmd = "npx prisma migrate deploy --schema packages/database/prisma/schema.prisma && node apps/api/dist/apps/api/src/main.js"